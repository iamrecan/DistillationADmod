data_path: "dataset"  # Base dataset directory
distillType: "sn"  # SingleNet
obj: "wood"  # Dataset name
phase: "train"  # Training phase
save_path: "results"  # Output directory

TrainingData:
  epochs: 100
  batch_size: 32
  lr: 0.0004
  img_size: 224
  crop_size: 224
  norm: true

